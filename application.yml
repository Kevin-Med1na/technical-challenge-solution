server:
  port: 8080

spring:
  application:
    name: technical-challenge-solution
  datasource:
    url: jdbc:postgresql://localhost:5432/technical_challenge_solution
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html